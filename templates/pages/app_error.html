{% extends "base.html" %}
{% block title %}{{ error_title }} · BloodConnect BD{% endblock %}
{% block content %}
<main class="app-utility-page app-error-page">
  <section class="app-section-card app-empty-state" aria-labelledby="app-error-title">
    <span class="app-empty-state__icon" aria-hidden="true">{{ error_status }}</span>
    <h1 id="app-error-title">{{ error_heading }}</h1>
    <p>{{ error_copy }}</p>
    <div class="app-action-bar">
      <a class="btn btn-brand" href="{% url 'home' %}">Return to dashboard</a>
      <a class="btn btn-outline-secondary" href="{% url 'safety' %}">Help and safety</a>
    </div>
  </section>
</main>
{% endblock %}
