<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
<title id="title">Application user flow</title>
<desc id="desc">A donor decides whether contact proceeds; contact channels remain consent gated.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#667085"/></marker></defs>
<rect width="100%" height="100%" rx="28" fill="#f7f8fa"/>
<text x="56" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#172b4d">Application user flow</text>
<text x="56" y="94" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#667085">A donor decides whether contact proceeds; contact channels remain consent gated.</text>
<path d="M205.0 202.5 L615.0 202.5" fill="none" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M205.0 202.5 L1050.0 202.5" fill="none" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M615.0 202.5 L615.0 417.5" fill="none" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow)"/>
<text x="620.0" y="304.0" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#667085">discoverable</text>
<path d="M1050.0 202.5 L615.0 417.5" fill="none" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow)"/>
<text x="837.5" y="304.0" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#667085">request</text>
<path d="M615.0 417.5 L615.0 622.5" fill="none" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow)"/>
<text x="620.0" y="514.0" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#667085">pending</text>
<path d="M615.0 622.5 L205.0 622.5" fill="none" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow)"/>
<text x="415.0" y="616.5" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#667085">decline</text>
<path d="M615.0 622.5 L1050.0 622.5" fill="none" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow)"/>
<text x="837.5" y="616.5" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#667085">accept</text>
<rect x="55" y="150" width="300" height="105" rx="18" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
<rect x="55" y="150" width="7" height="105" rx="3" fill="#b4232a"/>
<text x="79" y="184" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#172b4d">1 ? Visitor</text>
<text x="79" y="210" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#667085">Register, sign in, verify</text>
<rect x="465" y="150" width="300" height="105" rx="18" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
<rect x="465" y="150" width="7" height="105" rx="3" fill="#b4232a"/>
<text x="489" y="184" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#172b4d">2 ? Donor</text>
<text x="489" y="210" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#667085">Self-reported profile + consent</text>
<rect x="875" y="150" width="350" height="105" rx="18" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
<rect x="875" y="150" width="7" height="105" rx="3" fill="#b4232a"/>
<text x="899" y="184" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#172b4d">3 ? Recipient</text>
<text x="899" y="210" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#667085">Search or create a blood request</text>
<rect x="465" y="365" width="300" height="105" rx="18" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
<rect x="465" y="365" width="7" height="105" rx="3" fill="#b4232a"/>
<text x="489" y="399" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#172b4d">4 ? Contact request</text>
<text x="489" y="425" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#667085">Private details stay hidden</text>
<rect x="465" y="570" width="300" height="105" rx="18" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
<rect x="465" y="570" width="7" height="105" rx="3" fill="#b4232a"/>
<text x="489" y="604" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#172b4d">5 ? Donor decision</text>
<text x="489" y="630" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#667085">Accept, decline, or let expire</text>
<rect x="55" y="570" width="300" height="105" rx="18" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
<rect x="55" y="570" width="7" height="105" rx="3" fill="#b4232a"/>
<text x="79" y="604" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#172b4d">Decline / expire</text>
<text x="79" y="630" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#667085">No contact detail disclosed</text>
<rect x="875" y="570" width="350" height="105" rx="18" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
<rect x="875" y="570" width="7" height="105" rx="3" fill="#b4232a"/>
<text x="899" y="604" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#172b4d">Accepted connection</text>
<text x="899" y="630" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#667085">Only consented channel may be shown</text>
</svg>